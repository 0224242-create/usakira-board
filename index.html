<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>うさ★きら掲示板 - スレッド一覧</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{ margin:0; font-family:sans-serif; background: linear-gradient(#120c1f, #1a1625); color: #e0d9f0; min-height: 100vh; }
#headerArea { background: #1c142c; padding: 16px; border-bottom: 2px solid #3d2d5a; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
h1 { margin: 0; font-size: 1.5rem; color: #9d88ff; text-shadow: 0 0 10px rgba(157, 136, 255, 0.3); }
.admin-control-panel { display: flex; align-items: center; gap: 8px; }
.admin-btn { font-size: 11px; padding: 4px 8px; background: #3a1c28; border: 1px solid #632337; color: #ff6b81; font-weight: bold; border-radius: 4px; cursor: pointer; }
.admin-btn:hover { background: #4d2233; }
.logout-btn { font-size: 11px; padding: 4px 8px; background: #2d2640; border: 1px solid #4a3f66; color: #c3b8e0; font-weight: bold; border-radius: 4px; cursor: pointer; }
.logout-btn:hover { background: #3d3457; }
.user-profile-badge { background: #1c3322; padding: 6px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #2d5a39; color: #a2f0b5; }
.user-profile-badge img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

#mainContainer { max-width: 800px; margin: 0 auto; padding: 16px; }

/* 🔍 検索バーの装飾 */
#searchBox { margin-bottom: 14px; }
#searchInput { width: 100%; padding: 10px 14px; background: #1c142c; border: 1px solid #3d2d5a; border-radius: 8px; box-sizing: border-box; color: #fff; font-size: 14px; }
#searchInput:focus { border-color: #6c5ce7; outline: none; box-shadow: 0 0 8px rgba(108, 92, 231, 0.3); }

#createThreadBox { background: #1c142c; padding: 16px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); margin-bottom: 20px; border: 1px solid #3d2d5a; }
#createThreadBox h3 { margin-top: 0; color: #e0d9f0; }
#createThreadBox input, #createThreadBox textarea { width: 100%; padding: 8px; margin-bottom: 10px; background: #251b3a; border: 1px solid #4a3f66; border-radius: 6px; box-sizing: border-box; font-size: 14px; color: #fff; }
#createThreadBox input::placeholder, #createThreadBox textarea::placeholder { color: #7d7299; }
#createThreadBox textarea { height: 80px; resize: vertical; }
#submitThreadBtn { padding: 8px 16px; background: #6c5ce7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(108, 92, 231, 0.4); }
#submitThreadBtn:hover { background: #5b4cc4; }
#submitThreadBtn:disabled { background: #3d3754; color: #777; cursor: not-allowed; box-shadow: none; }

#threadList { background: transparent; min-height: 100px; }
.thread-card { background: #1c142c; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 8px; position: relative; border: 1px solid #32254f; }
.thread-card:hover { border-color: #4a3a75; }

/* 📌 固定されたスレッドの特別枠スタイル */
.thread-card.pinned-style { border: 1px solid #ffb142; background: linear-gradient(to right, #241926, #1c142c); }
.pin-badge { background: #ffb142; color: #1c142c; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }

.thread-header { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #a29bfe; }
.thread-header img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; border: 1px solid #4a3f66; }
.thread-title-link { font-size: 1.2rem; font-weight: bold; color: #ffffff; text-decoration: none; word-break: break-all; }
.thread-title-link:hover { color: #b39eff; text-decoration: underline; }
.thread-body-preview { font-size: 14px; color: #c3b8e0; white-space: pre-wrap; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thread-body-preview a { color: #9d88ff; text-decoration: underline; }
.thread-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #7d7299; margin-top: 4px; flex-wrap: wrap; gap: 8px; }

/* 💬 コメント数のバッジ */
.comment-count-badge { display: inline-flex; align-items: center; gap: 4px; background: #251b3a; color: #b39eff; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; border: 1px solid #3d2d5a; }

.thread-actions { display: flex; gap: 6px; }
.thread-actions button { font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer; border: 1px solid #4a3f66; }
.btn-thread-delete { background: #2d2640; color: #c3b8e0; }
.btn-thread-delete:hover { background: #3d3457; }
.btn-thread-admin-delete { background: #892224; color: white; border: 1px solid #b33939 !important; font-weight: bold; }
.btn-thread-admin-delete:hover { background: #b33939; }
.btn-thread-pin { background: #2c3e50; color: #ffb142; border: 1px solid #ffb142 !important; font-weight: bold; }
.btn-thread-pin:hover { background: #34495e; }
</style>
</head>
<body>

<div id="headerArea">
  <h1>🐰 うさ★きら掲示板 ✨️</h1>
  <div class="admin-control-panel">
    <button id="adminLoginBtn" class="admin-btn">👑 管理者ログイン</button>
    <button id="logoutBtn" class="logout-btn" style="display: none;">🚪 ログアウト</button>
    <div id="userBadge" class="user-profile-badge" style="display: none;">
      <img id="myIcon" src="">
      <span id="myName"></span>
      <input type="text" id="inputProfileName" placeholder="名前変更" maxlength="50" style="font-size:11px; padding:2px 4px; background:#251b3a; border:1px solid #4a3f66; color:#fff; border-radius:4px; max-width:80px;">
      <input type="file" id="fileProfileIcon" accept="image/*" style="display:none;">
      <button type="button" class="admin-btn" style="background:#2d2640; border-color:#4a3f66; color:#b39eff; font-size:11px; padding:2px 6px;" onclick="document.getElementById('fileProfileIcon').click()">🖼️</button>
      <button type="button" id="btnSaveProfile" class="admin-btn" style="background:#2d5a39; border-color:#2d5a39; color:#a2f0b5; font-size:11px; padding:2px 6px;">保存</button>
    </div>
  </div>
</div>

<div id="mainContainer">
  <div id="searchBox">
    <input id="searchInput" type="text" placeholder="🔍 スレッドのタイトルでリアルタイム検索...">
  </div>

  <div id="createThreadBox">
    <h3>新しいスレッドを立てる</h3>
    <input id="threadTitleInput" type="text" placeholder="スレッドのタイトル（100文字以内）">
    <textarea id="threadBodyInput" placeholder="スレッドの本文（任意・5000文字以内）"></textarea>
    <button id="submitThreadBtn">スレッドを作成</button>
  </div>

  <div id="threadList">読み込み中…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
import { getAuth, signInAnonymously, linkWithPopup, signInWithCredential, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
import { getDatabase, ref, onValue, push, remove, query, orderByChild, limitToLast, update } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

const firebaseConfig={
  apiKey: "AIzaSyDwp6403Wctjo-2vjR373CjfJXDDGUp7do",
  authDomain: "keijiban-7c651.firebaseapp.com",
  projectId: "keijiban-7c651",
  storageBucket: "keijiban-7c651.appspot.com",
  messagingSenderId: "587652395561",
  appId: "1:587652395561:web:ddf858fdf84df2438491c3",
  databaseURL: "https://keijiban-7c651-default-rtdb.firebaseio.com"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const googleProvider = new GoogleAuthProvider();

const defaultName="名もなき兎";
const defaultIcon="usagi.png.jpeg";

let currentUid = null;
let isGlobalAdmin = false;
let globalThreadsData = []; 
let globalCountsData = {};   

let stopAdminListener = null;
let stopThreadsListener = null;
let stopCountsListener = null;

let userName = localStorage.getItem("usakira_name") || defaultName;
let userIcon = localStorage.getItem("usakira_icon") || defaultIcon;

document.getElementById("searchInput").oninput = () => {
  renderThreadsList();
};

document.getElementById("adminLoginBtn").onclick = () => {
  if (!auth.currentUser) return;
  linkWithPopup(auth.currentUser, googleProvider)
    .then(() => { alert("管理者アカウントとの統合に成功したよ！ 🐰✨"); })
    .catch(error => {
      if (error.code === "auth/credential-already-in-use" || error.code === "auth/account-exists-with-different-credential") {
        const credential = GoogleAuthProvider.credentialFromError(error);
        if (credential) {
          alert("このGoogleアカウントは既に登録されています。既存の管理者セッションへ切り替えます 👑");
          signInWithCredential(auth, credential).catch(e => alert("サインイン失敗: " + e.message));
        }
      } else {
        alert("ログインエラー: " + error.code);
      }
    });
};

document.getElementById("logoutBtn").onclick = async () => {
  if (!confirm("ログアウトするぺこ？\n(一般ユーザー状態に戻る、または現在の管理セッションを終了します)")) return;
  try {
    if (stopAdminListener) stopAdminListener();
    if (stopThreadsListener) stopThreadsListener();
    if (stopCountsListener) stopCountsListener();
    await signOut(auth);
    currentUid = null;
    isGlobalAdmin = false;
    alert("ログアウトしたよ！新しいセッションを再構築します 🚪");
  } catch (error) {
    console.error("Logout Error:", error);
    alert("ログアウト中にエラーが発生しました。");
  }
};

function isSafeUrl(urlStr) {
  if (!urlStr) return true;
  if (urlStr.startsWith("javascript:") || urlStr.startsWith("data:")) return false;
  return urlStr.startsWith("http://") || urlStr.startsWith("https://");
}

function renderTextWithLinks(targetElement, text) {
  targetElement.textContent = ""; 
  if (!text) return;
  const urlRegex = /(https?:\/\/[^\s<]+)/g;
  const parts = text.split(urlRegex);
  parts.forEach(part => {
    if (part.startsWith("http://") || part.startsWith("https://")) {
      if (isSafeUrl(part)) {
        const anchor = document.createElement("a");
        anchor.href = part;
        anchor.textContent = part;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        targetElement.appendChild(anchor);
      } else {
        targetElement.appendChild(document.createTextNode(part));
      }
    } else {
      targetElement.appendChild(document.createTextNode(part));
    }
  });
}

window.deleteThread = async (tId) => {
  if (!confirm("このスレッドを本当に削除するぺこ？")) return;
  try {
    await remove(ref(db, `threads/${tId}`));
    await remove(ref(db, `posts/${tId}`)); 
    await remove(ref(db, `thread-comment-counts/${tId}`)); 
    alert("スレッドを削除したよ 🐰🧹");
  } catch (error) {
    console.error(error);
    alert("削除に失敗しました。");
  }
};

window.togglePinThread = async (tId, currentStatus) => {
  try {
    await update(ref(db, `threads/${tId}`), { pinned: !currentStatus });
    alert(!currentStatus ? "スレッドを固定したよ！📌" : "スレッド固定を解除したよ！📍");
  } catch (error) {
    console.error(error);
    alert("固定状態の変更に失敗しました。");
  }
};
window.togglePinThread = async (tId, currentStatus) => {
  try {
    await update(ref(db, `threads/${tId}`), { pinned: !currentStatus });
    alert(!currentStatus ? "スレッドを固定したよ！📌" : "スレッド固定を解除したよ！📍");
  } catch (error) {
    console.error(error);
    alert("固定状態の変更に失敗しました。");
  }
};

function updateProfileBadge(isGoogleLinked) {
updateProfileBadge(isGoogleLinked);
    startSync();
  });
});

function startSync() {
  if (stopThreadsListener) stopThreadsListener();
  if (stopCountsListener) stopCountsListener();

  stopCountsListener = onValue(ref(db, "thread-comment-counts"), snap => {
    globalCountsData = snap.val() || {};
    renderThreadsList(); 
  });

  const threadsQuery = query(ref(db, "threads"), orderByChild("lastTime"), limitToLast(50));
  
  stopThreadsListener = onValue(threadsQuery, snap => {
    const data = snap.val();
    if (!data) {
      globalThreadsData = [];
      renderThreadsList();
      return;
    }
    globalThreadsData = Object.entries(data);
    renderThreadsList();
  });
}

function renderThreadsList() {
  const listContainer = document.getElementById("threadList");
  listContainer.textContent = "";

  if (globalThreadsData.length === 0) {
    listContainer.textContent = "スレッドがまだありません。最初のスレを立ててみよう！";
    return;
  }

  const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

  const sorted = [...globalThreadsData].sort((a, b) => {
    const pinA = a[1].pinned ? 1 : 0;
    const pinB = b[1].pinned ? 1 : 0;
    if (pinB !== pinA) return pinB - pinA; 
    return (b[1].lastTime || 0) - (a[1].lastTime || 0); 
  });

  let hasVisibleCard = false;

  sorted.forEach(([key, t]) => {
    if (keyword && !t.title.toLowerCase().includes(keyword)) {
      return; 
    }
    hasVisibleCard = true;

    const commentCount = globalCountsData[key] || 0;

    const card = document.createElement("div");
    card.classList.add("thread-card");
    if (t.pinned) card.classList.add("pinned-style"); 

    const header = document.createElement("div");
    header.classList.add("thread-header");
    
    if (t.pinned) {
      const pinBadge = document.createElement("span");
      pinBadge.classList.add("pin-badge");
      pinBadge.textContent = "📌 固定スレ";
      header.appendChild(pinBadge);
    }

    const iconImg = document.createElement("img");
    iconImg.src = isSafeUrl(t.ownerIcon) ? (t.ownerIcon || defaultIcon) : defaultIcon;
    iconImg.onerror = () => { iconImg.src = defaultIcon; };
    const metaSpan = document.createElement("span");
    metaSpan.textContent = `${t.ownerName || defaultName} が作成 ・ ${t.time ? new Date(t.time).toLocaleString() : ""}`;
    header.appendChild(iconImg);
    header.appendChild(metaSpan);

    const titleLink = document.createElement("a");
    titleLink.classList.add("thread-title-link");
    titleLink.href = `thread.html?id=${key}`;
    titleLink.textContent = t.title || "無題のスレッド";

    card.appendChild(header);
    card.appendChild(titleLink);

    if (t.body && t.body.trim() !== "") {
      const preview = document.createElement("div");
      preview.classList.add("thread-body-preview");
      renderTextWithLinks(preview, t.body);
      card.appendChild(preview);
    }

    const footer = document.createElement("div");
    footer.classList.add("thread-footer");
    
    const badgeSpan = document.createElement("span");
    badgeSpan.classList.add("comment-count-badge");
    badgeSpan.textContent = `💬 ${commentCount} 件`;
    footer.appendChild(badgeSpan);

    const lastUpdateSpan = document.createElement("span");
    lastUpdateSpan.textContent = t.lastTime ? `最新の投稿: ${new Date(t.lastTime).toLocaleString()}` : "";
    footer.appendChild(lastUpdateSpan);

    const actions = document.createElement("div");
    actions.classList.add("thread-actions");

    if (isGlobalAdmin) {
      const pinBtn = document.createElement("button");
      pinBtn.classList.add("btn-thread-pin");
      pinBtn.textContent = t.pinned ? "📍 解除" : "📌 固定";
      pinBtn.onclick = (e) => { e.preventDefault(); window.togglePinThread(key, t.pinned || false); };
      actions.appendChild(pinBtn);

      const delBtn = document.createElement("button");
      delBtn.classList.add("btn-thread-admin-delete");
      delBtn.textContent = "👑 管理削除";
      delBtn.onclick = (e) => { e.preventDefault(); window.deleteThread(key); };
      actions.appendChild(delBtn);
      footer.appendChild(actions);
    } else if (t.ownerId === currentUid) {
      const delBtn = document.createElement("button");
      delBtn.classList.add("btn-thread-delete");
      delBtn.textContent = "🗑 スレ削除";
      delBtn.onclick = (e) => { e.preventDefault(); window.deleteThread(key); };
      actions.appendChild(delBtn);
      footer.appendChild(actions);
    }

    card.appendChild(footer);
    listContainer.appendChild(card);
  });

  if (!hasVisibleCard) {
    listContainer.textContent = "検索ワードに一致するスレッドが見つかりません。";
  }
}

// 🖼️ 画像圧縮ロジック（thread.htmlの優秀な関数をここにも完全移植）
function compressImage(file){
  return new Promise((resolve, reject) => {
    const img=new Image(); 
    const canvas=document.createElement("canvas"); 
    const ctx=canvas.getContext("2d");
    const objectUrl = URL.createObjectURL(file);
    
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      reject(new Error("画像の読み込みに失敗しました。"));
    };

    img.onload=()=>{
      let w=img.width; let h=img.height; const max=1000;
      if(w>h){ if(w>max){ h*=max/w; w=max; } }else{ if(h>max){ w*=max/h; h=max; } }
      canvas.width=w; canvas.height=h; ctx.drawImage(img,0,0,w,h);
      
      canvas.toBlob(blob=>{ 
        URL.revokeObjectURL(objectUrl);
        if (!blob) {
          reject(new Error("画像の圧縮処理に失敗しました。"));
          return;
        }
        resolve(blob); 
      },"image/jpeg",0.7);
    };
    img.src=objectUrl;
  });
}

// ☁️ Cloudinaryアップロードロジック（thread.htmlと同じプリセット名を使用）
async function uploadImage(file){
  const compressed=await compressImage(file);
  const formData=new FormData();
  formData.append("file",compressed);
  formData.append("upload_preset","usakira_upload"); // 👈 thread.htmlと同じに統一
  
  const res=await fetch("https://api.cloudinary.com/v1_1/dfhevulda/image/upload",{method:"POST",body:formData});
  if(!res.ok) throw new Error(`Upload Failed: Status ${res.status}`);
  
  const data=await res.json();
  if(!data.secure_url) throw new Error("Missing secure_url");
  return data.secure_url;
}

document.getElementById("submitThreadBtn").onclick = async () => {
  if (!currentUid) return alert("ログイン処理中です");

  const btn = document.getElementById("submitThreadBtn");
  const title = document.getElementById("threadTitleInput").value.trim();
  const body = document.getElementById("threadBodyInput").value.trim();

  if (!title) return alert("タイトルを入力してください！");
  if (title.length > 100) return alert("タイトルは100文字以内にしてね");
  if (body.length > 5000) return alert("本文は5000文字以内にしてね");

  btn.disabled = true;

  try {
    const timestamp = Date.now();
    
  const newThreadRef = push(ref(db, "threads"));
    const tId = newThreadRef.key;

    const updates = {};
    updates[`threads/${tId}`] = {
      title: title,
      body: body,
      ownerId: currentUid,
      ownerName: userName.substring(0, 50),
      ownerIcon: userIcon,
      time: timestamp,
      lastTime: timestamp,
      pinned: false 
    };
    
    // 🐰 ここを追加！1件目の自動レスをpostsに格納する設計に
    const firstPostRef = push(ref(db, `posts/${tId}`));
    const firstPostKey = firstPostRef.key;
    updates[`posts/${tId}/${firstPostKey}`] = {
      text: body || "（本文なしスレッドが作成されました）",
      time: timestamp,
      userName: userName.substring(0, 50),
      userIcon: userIcon,
      userId: currentUid
    };

    updates[`thread-comment-counts/${tId}`] = 1; 

    await update(ref(db), updates);
    document.getElementById("threadTitleInput").value = "";
    document.getElementById("threadBodyInput").value = "";
    alert("スレッドを立てたよ！ 🚀");
  } catch (error) {
    console.error("Create Thread Error:", error);
    alert("スレッドの作成に失敗しました。ルール違反の可能性があります。");
  } finally {
    btn.disabled = false;
  }
};

// 👤 右上バッジ内のプロフィール保存ボタンの挙動
document.getElementById("btnSaveProfile").onclick = async () => {
  if (!auth.currentUser) return;
  const newName = document.getElementById("inputProfileName").value.trim();
  if (!newName) return alert("名前を入力してね！");

  const fileInput = document.getElementById("fileProfileIcon");
  let iconUrl = localStorage.getItem("usakira_icon") || defaultIcon; 

  if (fileInput.files.length > 0) {
    try {
      iconUrl = await uploadImage(fileInput.files[0]);
    } catch (err) {
      console.error(err);
      return alert("アイコンのアップロードに失敗しました");
    }
  }

  // 端末のローカルストレージに保存
  localStorage.setItem("usakira_name", newName);
  localStorage.setItem("usakira_icon", iconUrl);

  // グローバル変数を更新
  userName = newName;
  userIcon = iconUrl;

  // 右上のバッジを即時更新
  document.getElementById("myName").textContent = userName;
 // 変更後（これに差し替え！）
const isGoogleLinked = auth.currentUser.providerData.some(p => p.providerId === "google.com");
updateProfileBadge(isGoogleLinked);

alert("変更完了したよ！🐰");
};
</script>
</body>
</html>
