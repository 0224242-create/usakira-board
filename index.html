<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🐰 うさキラ掲示板 ✨️</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { color: #ff6b81; }
    .form-group { margin-bottom: 15px; }
    input, textarea { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #ff6b81; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .thread-item { padding: 15px; border-bottom: 1px solid #eee; position: relative; }
    .thread-title { font-size: 1.2em; font-weight: bold; color: #333; text-decoration: none; }
    .thread-title:hover { text-decoration: underline; }
    .meta { font-size: 0.85em; color: #777; margin-top: 5px; }
    .comment-badge { background: #ff6b81; color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.85em; font-weight: bold; margin-left: 8px; }
    .delete-btn { position: absolute; right: 10px; top: 15px; background: #ff4757; padding: 5px 10px; font-size: 0.8em; }
  </style>
</head>
<body>

<div class="container">
  <h1>🐰 うさキラ掲示板 ✨️</h1>

  <!-- 📢 ログイン不要！最初から全開放されているスレ作成エリア -->
  <div style="background: #fff0f2; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
    <h3>新しくスレッドを立てるぺこ</h3>
    <div class="form-group">
      <label>スレッドタイトル</label>
      <input id="threadTitleInput" placeholder="スレッドのタイトル（100文字以内）">
    </div>
    <div class="form-group">
      <label>本文</label>
      <textarea id="threadBodyInput" rows="3" placeholder="ここに本文を書くぺこ..."></textarea>
    </div>
    <button id="submitThreadBtn">スレッドを作成</button>
    <span id="adminStatus" style="font-size: 0.8em; color: #aaa; margin-left: 10px;">一般モード</span>
  </div>

  <h2>スレッド一覧</h2>
  <div id="threadsList">スレッドを読み込み中...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, query, orderByChild, update } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

  // 🛠️ 【超重要】ここをご自身の Firebase 情報に「最後の一回」書き換えてください！
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let currentUid = null;
  let isGlobalAdmin = false;

  // 👤 管理人の判定のためだけに、裏でひっそり匿名認証を走らせる（一般の人は無視でOK）
  signInAnonymously(auth).catch(e => console.log("匿名ゲスト接続"));
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUid = user.uid;
      // 管理者リストに自分がいるかチェック
      onValue(ref(db, `admins/${currentUid}`), snap => {
        if (snap.val()) {
          isGlobalAdmin = true;
          document.getElementById("adminStatus").textContent = "👑 管理人モード";
        }
      });
    }
  });

  // 📝 スレッド作成（ログインチェックを完全撤廃！）
  document.getElementById("submitThreadBtn").onclick = async () => {
    const title = document.getElementById("threadTitleInput").value.trim();
    const body = document.getElementById("threadBodyInput").value.trim();
    if (!title || !body) { alert("入力してください"); return; }

    try {
      const now = Date.now();
      const tId = push(ref(db, "threads")).key;
      const updates = {};
      updates[`threads/${tId}`] = {
        title: title,
        body: body,
        ownerId: currentUid || "guest", // ログインしてなくてもguestとして作成可能
        ownerName: "名無しさん",
        ownerIcon: "🐰",
        time: now,
        lastTime: now
      };
      updates[`thread-comment-counts/${tId}`] = 0;

      await update(ref(db), updates);
      document.getElementById("threadTitleInput").value = "";
      document.getElementById("threadBodyInput").value = "";
    } catch (e) {
      alert("送信エラー：セキュリティルールまたは設定URLを確認してね");
    }
  };

  // 📂 スレッド一覧の取得（ログイン関係なく、開いた瞬間0秒で爆走読み込み！）
  const threadsQuery = query(ref(db, "threads"), orderByChild("lastTime"));
  onValue(threadsQuery, (snapshot) => {
    const threadsList = document.getElementById("threadsList");
    threadsList.innerHTML = "";
    const data = snapshot.val();
    if (!data) { threadsList.innerHTML = "<p>スレッドがまだありません。</p>"; return; }

    const items = [];
    snapshot.forEach((childSnapshot) => { items.push({ id: childSnapshot.key, ...childSnapshot.val() }); });
    items.reverse();

    items.forEach(thread => {
      const div = document.createElement("div");
      div.className = "thread-item";

      // 👑 管理人、または自分が建てたスレなら削除ボタンを出す
      const showDelete = isGlobalAdmin || (currentUid && thread.ownerId === currentUid);
      const deleteHtml = showDelete ? `<button class="delete-btn" onclick="deleteThread('${thread.id}')">削除</button>` : "";

      const countSpanId = `count-${thread.id}`;
      onValue(ref(db, `thread-comment-counts/${thread.id}`), countSnap => {
        const el = document.getElementById(countSpanId);
        if (el) el.textContent = `${countSnap.val() || 0}コメ`;
      });

      div.innerHTML = `
        <a href="thread.html?id=${thread.id}" class="thread-title">${escapeHtml(thread.title)}</a>
        <span class="comment-badge" id="${countSpanId}">0コメ</span>
        <div class="meta">更新: ${new Date(thread.lastTime).toLocaleString()}</div>
        ${deleteHtml}
      `;
      threadsList.appendChild(div);
    });
  });

  // 🧹 スレッド削除
  window.deleteThread = async (tId) => {
    if (!confirm("このスレッドを削除するぺこ？")) return;
    try {
      const updates = {};
      updates[`threads/${tId}`] = null;
      updates[`posts/${tId}`] = null; 
      updates[`thread-comment-counts/${tId}`] = null;
      await update(ref(db), updates);
    } catch (e) { alert("削除権限がありません。"); }
  };

  function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
</script>
</body>
</html>
