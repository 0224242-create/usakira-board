<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🐰　うさ★きら掲示板 ✨</title>
  <style>
    body { font-family: sans-serif; background: #fff0f5; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
    h1 { color: #ff69b4; text-align: center; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .profile-section { background: #ffe4e1; border: 2px dashed #ffb6c1; }
    .flex { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #ff69b4; }
    input, textarea, button { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    textarea { width: 100%; height: 80px; resize: vertical; }
    button { background: #ff69b4; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #ff1493; }
    button.btn-delete { background: #999; }
    button.btn-delete:hover { background: #666; }
    .hidden { display: none; }
    .pin { background: #fffacd; border: 2px solid #ffd700; }
    .badge-pin { background: #ffd700; color: #333; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🐰うさ★きら掲示板 ✨</h1>

  <div class="card">
    <div id="auth-logged-out">
      <button id="btn-login">匿名ログインするぺこ！</button>
    </div>
    <div id="auth-logged-in" class="hidden">
      <div class="flex">
        <img id="my-avatar" class="avatar" src="https://res.cloudinary.com/dfhevulda/image/upload/v1710000000/default-icon.png" alt="icon">
        <div>
          ログイン中: <strong id="my-name-display">ゲストうさぎ</strong><br>
          <small id="my-uid"></small>
        </div>
        <button id="btn-logout" class="btn-delete">ログアウト</button>
      </div>
    </div>
  </div>

  <div id="profile-edit-section" class="card profile-section hidden">
    <h3>👤 プロフィール設定</h3>
    <div class="flex">
      <label>名前: <input type="text" id="input-profile-name" placeholder="新しいお名前" maxlength="50"></label>
    </div>
    <div class="flex">
      <label>アイコン変更: <input type="file" id="file-profile-icon" accept="image/*"></label>
      <span id="profile-upload-status" style="font-size: 12px; color: #666;"></span>
    </div>
    <button id="btn-save-profile">プロフィールを保存するぺこ！</button>
  </div>

  <div id="thread-create-section" class="card hidden">
    <h3>📝 新しいスレッドを立てる</h3>
    <div class="flex">
      <input type="text" id="input-title" placeholder="スレッドのタイトル（100文字以内）" style="flex: 1;" maxlength="100">
    </div>
    <textarea id="input-body" placeholder="スレッドの本文（5000文字以内）" maxlength="5000"></textarea>
    <button id="btn-create-thread">スレッド作成！</button>
  </div>

  <h2>スレッド一覧</h2>
  <div id="threads-container">スレッドを読み込み中...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, update, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ⚙️ Firebase 初期化
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      databaseURL: "YOUR_DATABASE_URL",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // ⚙️ Cloudinary 設定
    const CLOUD_NAME = "dfhevulda";
    const UPLOAD_PRESET = "usakira_preset"; // 事前にCloudinary側でUnsignedとして作成しておいてね

    // 🔄 ローカルの状態管理
    let currentUser = null;
    let currentProfile = {
      name: "ゲストうさぎ",
      icon: "https://res.cloudinary.com/dfhevulda/image/upload/v1710000000/default-icon.png"
    };

    // 🔓 認証状態の監視
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("auth-logged-out").classList.add("hidden");
        document.getElementById("auth-logged-in").classList.remove("hidden");
        document.getElementById("profile-edit-section").classList.remove("hidden");
        document.getElementById("thread-create-section").classList.remove("hidden");
        document.getElementById("my-uid").innerText = `UID: ${user.uid}`;
        
        // ローカルストレージから保存済みのプロフィールを復元
        const savedName = localStorage.getItem(`profile_name_${user.uid}`);
        const savedIcon = localStorage.getItem(`profile_icon_${user.uid}`);
        if (savedName) currentProfile.name = savedName;
        if (savedIcon) currentProfile.icon = savedIcon;

        updateProfileUI();
      } else {
        currentUser = null;
        document.getElementById("auth-logged-out").classList.remove("hidden");
        document.getElementById("auth-logged-in").classList.add("hidden");
        document.getElementById("profile-edit-section").classList.add("hidden");
        document.getElementById("thread-create-section").classList.add("hidden");
      }
    });

    // 👤 プロフィールUI更新
    function updateProfileUI() {
      document.getElementById("my-avatar").src = currentProfile.icon;
      document.getElementById("my-name-display").innerText = currentProfile.name;
      document.getElementById("input-profile-name").value = currentProfile.name;
    }

    // ☁️ Cloudinaryへの汎用アップロード関数
    async function uploadToCloudinary(file, statusElementId) {
      const statusEl = document.getElementById(statusElementId);
      statusEl.innerText = "アップロード中...";
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (data.secure_url) {
          statusEl.innerText = "完了✨";
          return data.secure_url;
        }
        throw new Error("URLの取得に失敗");
      } catch (err) {
        console.error(err);
        statusEl.innerText = "失敗❌";
        return null;
      }
    }

    // 💾 プロフィール保存処理
    document.getElementById("btn-save-profile").addEventListener("click", async () => {
      if (!currentUser) return;
      const newName = document.getElementById("input-profile-name").value.trim();
      if (!newName) return alert("名前を入力してね！");

      const fileInput = document.getElementById("file-profile-icon");
      if (fileInput.files.length > 0) {
        const uploadedUrl = await uploadToCloudinary(fileInput.files[0], "profile-upload-status");
        if (uploadedUrl) currentProfile.icon = uploadedUrl;
      }

      currentProfile.name = newName;
      localStorage.setItem(`profile_name_${currentUser.uid}`, currentProfile.name);
      localStorage.setItem(`profile_icon_${currentUser.uid}`, currentProfile.icon);
      
      updateProfileUI();
      alert("プロフィールを更新したぺこ！🐰");
    });

    // 📝 スレッド作成処理
    document.getElementById("btn-create-thread").addEventListener("click", async () => {
      if (!currentUser) return alert("ログインしてね！");
      const title = document.getElementById("input-title").value.trim();
      const body = document.getElementById("input-body").value.trim();
      
      if (!title) return alert("タイトルは必須ぺこ！");

      const now = Date.now();
      const threadData = {
        title: title,
        body: body,
        ownerId: currentUser.uid,
        ownerName: currentProfile.name, // 👤 ユーザー設定の名前
        ownerIcon: currentProfile.icon, // 👤 ユーザー設定のアイコン
        time: now,
        lastTime: now,
        pinned: false
      };

      try {
        const newThreadRef = push(ref(db, "threads"));
        const tId = newThreadRef.key;

        const updates = {};
        updates[`threads/${tId}`] = threadData;
        updates[`thread-comment-counts/${tId}`] = 1; // バリデーションルールに合わせ、初期値は1

        await update(ref(db), updates);
        
        document.getElementById("input-title").value = "";
        document.getElementById("input-body").value = "";
        alert("スレッドを立てたよ！");
      } catch (err) {
        console.error(err);
        alert("作成に失敗しました。ルール違反の可能性があります。");
      }
    });

    // 📌 スレッド一覧の取得・リアルタイム描画
    const threadsRef = query(ref(db, "threads"), orderByChild("lastTime"));
    onValue(threadsRef, (snapshot) => {
      const container = document.getElementById("threads-container");
      container.innerHTML = "";
      
      const threads = [];
      snapshot.forEach((child) => {
        threads.push({ id: child.key, ...child.val() });
      });
      threads.reverse(); // 最新順（lastTime順）

      if (threads.length === 0) {
        container.innerText = "スレッドはありません。";
        return;
      }

      threads.forEach((t) => {
        const div = document.createElement("div");
        div.className = `card ${t.pinned ? 'pin' : ''}`;
        div.innerHTML = `
          <div class="flex">
            <img class="avatar" src="${t.ownerIcon || 'https://res.cloudinary.com/dfhevulda/image/upload/v1710000000/default-icon.png'}">
            <div>
              <h3>${t.pinned ? '<span class="badge-pin">固定</span> ' : ''}<a href="thread.html?id=${t.id}">${t.title}</a></h3>
              <small>スレ主: ${t.ownerName || '名無し'} | ${new Date(t.time).toLocaleString()}</small>
            </div>
          </div>
          <p>${t.body ? t.body.replace(/\n/g, "<br>") : ""}</p>
          <div id="count-${t.id}">コメント数: ...</div>
          <div id="actions-${t.id}" style="margin-top:10px;"></div>
        `;
        container.appendChild(div);

        // カウンターのリアルタイム取得
        onValue(ref(db, `thread-comment-counts/${t.id}`), (cSnap) => {
          document.getElementById(`count-${t.id}`).innerText = `コメント数: ${cSnap.val() || 0}`;
        });

        // 🧹 削除・固定ボタンの動的表示（本人・管理者のみ）
        if (currentUser) {
          onValue(ref(db, `admins/${currentUser.uid}`), (adminSnap) => {
            const isAdmin = adminSnap.val() === true;
            const isOwner = t.ownerId === currentUser.uid;

            if (isOwner || isAdmin) {
              const actionArea = document.getElementById(`actions-${t.id}`);
              actionArea.innerHTML = `<button class="btn-delete" onclick="deleteThread('${t.id}')">スレ削除</button>`;
            }
          });
        }
      });
    });

    // 🧹 アトミック一括削除（マルチパス更新）関数をグローバルに展開
    window.deleteThread = async (tId) => {
      if (!confirm("このスレッドを本当に削除するぺこ？")) return;
      try {
        const updates = {};
        updates[`threads/${tId}`] = null;
        updates[`posts/${tId}`] = null;
        updates[`thread-comment-counts/${tId}`] = null;

        await update(ref(db), updates);
        alert("スレッドを安全に一括削除したよ 🐰🧹");
      } catch (error) {
        console.error(error);
        alert("削除権限がないか、エラーが発生しました。");
      }
    };

    // 🔑 ログイン・ログアウト処理
    document.getElementById("btn-login").addEventListener("click", () => signInAnonymously(auth));
    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));
  </script>
</body>
</html>
