<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<h1 class="title">🐰うさ★キラ掲示板✨️</h1>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
.title{
font-size:2.4rem;
font-weight:bold;
color:white;
-webkit-text-stroke:2px #9b8cff;
text-shadow:0 0 8px #dcd6ff;
text-align:center;
}

body{
font-family:"Hiragino Kaku Gothic ProN",sans-serif;
background:linear-gradient(180deg,#ffffff,#f2edff);
padding:20px;
color:#222
}

button{
padding:6px 10px;
margin:4px;
border-radius:6px;
cursor:pointer
}

input,textarea{
padding:6px;
margin:4px 0;
width:100%;
box-sizing:border-box;
border-radius:6px;
border:1px solid #ccc
}

/* スレッド一覧をシンプルな見出しスタイルに変更 */
.thread-item {
padding:12px 8px;
border-bottom:1px solid #dcd6ff;
display:flex;
align-items:center;
justify-content:between;
gap:10px;
}

.thread-main {
flex:1;
font-size:1.1rem;
}

.thread-main a {
color:#4a3cff;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

.thread-main a:hover {
text-decoration:underline;
}

.comment-count {
font-size:0.85rem;
color:#777;
margin-left:8px;
}

.thread-actions button {
font-size:0.75rem;
padding:3px 6px;
margin:0 2px;
}
</style>
</head>
<body>

<h3>プロフィール</h3>
<input id="nameInput" placeholder="名前">
<input id="iconInput" placeholder="アイコンURL">
<input type="file" id="iconFile" accept="image/*">
<span id="iconFileName"></span>
<button id="saveProfileBtn">保存</button>

<hr>

<h2>スレッド作成</h2>
<input id="threadTitle" placeholder="タイトル">
<textarea id="threadBody" placeholder="本文（任意）"></textarea>
<input id="threadPass" placeholder="鍵スレのパスワード（任意）">
<button id="createThreadBtn">スレッドを作る</button>

<hr>

<h2>スレッド一覧</h2>
<div id="threadsBox">読み込み中…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDwp6403Wctjo-2vjR373CjfJXDDGUp7do",
databaseURL:"https://keijiban-7c651-default-rtdb.firebaseio.com"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const defaultName="名もなき兎";
const defaultIcon="usagi.png.jpeg";

let userId=localStorage.getItem("usakira_userId");
if(!userId){
userId="user_"+Math.random().toString(36).slice(2);
localStorage.setItem("usakira_userId",userId);
}

const nameInput=document.getElementById("nameInput");
const iconInput=document.getElementById("iconInput");

nameInput.value=localStorage.getItem("usakira_name")||defaultName;
iconInput.value=localStorage.getItem("usakira_icon")||defaultIcon;

document.getElementById("iconFile").onchange=e=>{
const file=e.target.files[0];
document.getElementById("iconFileName").textContent=file?file.name:"";
};

function compressImage(file){
return new Promise(resolve=>{
const img=new Image();
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");
img.onload=()=>{
let w=img.width; let h=img.height; const max=500;
if(w>h){ if(w>max){ h*=max/w; w=max; } }else{ if(h>max){ w*=max/h; h=max; } }
canvas.width=w; canvas.height=h;
ctx.drawImage(img,0,0,w,h);
canvas.toBlob(blob=>{ resolve(blob); },"image/jpeg",0.7);
};
img.src=URL.createObjectURL(file);
});
}

async function uploadImage(file){
const compressed=await compressImage(file);
const formData=new FormData();
formData.append("file",compressed);
formData.append("upload_preset","usakira_upload");
const res=await fetch("https://api.cloudinary.com/v1_1/dfhevulda/image/upload",{method:"POST",body:formData});
const data=await res.json();
return data.secure_url;
}

document.getElementById("saveProfileBtn").onclick=async()=>{
const file=document.getElementById("iconFile").files[0];
let iconURL=iconInput.value;
if(file){ iconURL=await uploadImage(file); }
localStorage.setItem("usakira_name",nameInput.value);
localStorage.setItem("usakira_icon",iconURL);
alert("保存したよ 🐰");
};

document.getElementById("createThreadBtn").onclick=async()=>{
const title=document.getElementById("threadTitle").value.trim();
if(!title) return alert("タイトルを書いてね");
const now=Date.now();
const newRef=await push(ref(db,"threads"),{
title:title,
body:document.getElementById("threadBody").value,
pass:document.getElementById("threadPass").value||null,
ownerId:userId,
ownerName:nameInput.value||defaultName,
ownerIcon:iconInput.value||defaultIcon,
time:now,
lastTime:now
});
location.href="thread.html?id="+newRef.key;
};

// グローバル関数を定義（Moduleスコープ外から呼べるようにする）
window.openThread = (id, hasPass, correctPass) => {
if(hasPass){
const pw=prompt("このスレは鍵付きだよ 🔒");
if(pw!==correctPass){ alert("パスワードが違うよ"); return; }
}
location.href="thread.html?id="+id;
};

window.editThreadTitle = async (id, oldTitle) => {
const newTitle = prompt("スレッドのタイトルを編集", oldTitle);
if(newTitle && newTitle.trim() !== ""){
await update(ref(db, "threads/" + id), { title: newTitle.trim() });
}
};

window.deleteThread = async (id) => {
if(confirm("このスレを削除する？（投稿も全部消える）")){
await remove(ref(db,"threads/"+id));
await remove(ref(db,"posts/"+id));
}
};

const threadsBox=document.getElementById("threadsBox");

// 全体の投稿（posts）データを監視してコメント数をリアルタイム計算する
onValue(ref(db,"posts"), postsSnap => {
const postsData = postsSnap.val() || {};

onValue(ref(db,"threads"),snap=>{
threadsBox.innerHTML="";
const data=snap.val();
if(!data){ threadsBox.innerHTML="<p>まだスレがないよ 🐰</p>"; return; }

Object.entries(data)
.sort((a,b)=>(b[1].lastTime||b[1].time)-(a[1].lastTime||a[1].time))
.forEach(([id,t])=>{
// このスレッドのコメント数をカウント
const commentCount = postsData[id] ? Object.keys(postsData[id]).length : 0;

const div=document.createElement("div");
div.className="thread-item";

// セキュリティ対策（HTMLエスケープ）
const escapedTitle = t.title.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let actionButtons = "";
// 自分が作ったスレッドなら「編集」「削除」ボタンを表示
if(t.ownerId === userId) {
actionButtons = `
<div class="thread-actions">
<button onclick="editThreadTitle('${id}', '${escapedTitle.replace(/'/g, "\\'")}')">編集</button>
<button onclick="deleteThread('${id}')">削除</button>
</div>
`;
}

div.innerHTML = `
<div class="thread-main">
<a onclick="openThread('${id}', ${!!t.pass}, '${t.pass || ''}')">
${t.pass ? "🔒 " : ""}${escapedTitle}
</a>
<span class="comment-count">(${commentCount})</span>
</div>
${actionButtons}
`;
threadsBox.appendChild(div);
});
});
});
</script>
</body>
</html>
