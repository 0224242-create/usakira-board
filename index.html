<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🐰 うさキラ掲示板 ✨️</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { color: #ff6b81; }
    .form-group { margin-bottom: 15px; }
    input, textarea { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #ff6b81; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .thread-item { padding: 15px; border-bottom: 1px solid #eee; position: relative; }
    .thread-title { font-size: 1.2em; font-weight: bold; color: #333; text-decoration: none; }
    .thread-title:hover { text-decoration: underline; }
    .meta { font-size: 0.85em; color: #777; margin-top: 5px; }
    .delete-btn { position: absolute; right: 10px; top: 15px; background: #ff4757; padding: 5px 10px; font-size: 0.8em; }
  </style>
</head>
<body>

<div class="container">
  <h1>🐰 うさキラ掲示板 ✨️</h1>

  <div style="background: #fff0f2; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
    <h3>新しくスレッドを立てるぺこ</h3>
    <div class="form-group">
      <label>スレッドタイトル</label>
      <input id="threadTitleInput" placeholder="ログイン処理中..." disabled>
    </div>
    <div class="form-group">
      <label>本文</label>
      <textarea id="threadBodyInput" rows="3" placeholder="ここに本文を書くぺこ..."></textarea>
    </div>
    <button id="submitThreadBtn" disabled>スレッドを作成</button>
    <span id="authStatus" style="font-size: 0.85em; color: #777; margin-left: 10px;">接続中...</span>
  </div>

  <h2>スレッド一覧</h2>
  <div id="threadsList">スレッドを読み込み中...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, update, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

  // 🛠️ あなたの Firebase 設定に書き換えてください
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let currentUid = null;
  let authReady = false;
  let isGlobalAdmin = false;

  // 🚀 爆速・キャッシュ優先の認証監視
  onAuthStateChanged(auth, user => {
    if (user) {
      // キャッシュがあれば一瞬でここを通る！
      currentUid = user.uid;
      authReady = true;

      // UIロックを即解除
      const titleInput = document.getElementById("threadTitleInput");
      const submitBtn = document.getElementById("submitThreadBtn");
      titleInput.disabled = false;
      titleInput.placeholder = "スレッドのタイトル（100文字以内）";
      submitBtn.disabled = false;
      document.getElementById("authStatus").textContent = "🐰 準備完了（爆速モード）";

      // 管理者チェックの開始
      onValue(ref(db, `admins/${currentUid}`), snap => {
        isGlobalAdmin = !!snap.val();
      });
    } else {
      // 完全な初回アクセス時だけサーバーへ通信
      authReady = false;
      signInAnonymously(auth).catch(e => console.error("匿名ログイン失敗:", e));
    }
  });

  // 📝 スレッド作成処理
  document.getElementById("submitThreadBtn").onclick = async () => {
    if (!authReady || !currentUid) { alert("ログイン処理中ぺこ！"); return; }

    const title = document.getElementById("threadTitleInput").value.trim();
    const body = document.getElementById("threadBodyInput").value.trim();

    if (!title || !body) { alert("タイトルと本文を入力してください"); return; }
    if (title.length > 100) { alert("タイトルは100文字以内にしてね"); return; }

    try {
      const now = Date.now();
      await push(ref(db, "threads"), {
        title: title,
        body: body,
        ownerId: currentUid,
        ownerName: "名無しさん",
        ownerIcon: "🐰",
        time: now,
        lastTime: now
      });

      document.getElementById("threadTitleInput").value = "";
      document.getElementById("threadBodyInput").value = "";
      alert("スレッドを作成したよ！ 🎉");
    } catch (e) {
      console.error(e);
      alert("スレッドの作成に失敗しました。");
    }
  };

  // 📂 スレッド一覧の取得
  const threadsQuery = query(ref(db, "threads"), orderByChild("lastTime"));
  onValue(threadsQuery, (snapshot) => {
    const threadsList = document.getElementById("threadsList");
    threadsList.innerHTML = "";
    const data = snapshot.val();

    if (!data) {
      threadsList.innerHTML = "<p>スレッドがまだありません。</p>";
      return;
    }

    const items = [];
    snapshot.forEach((childSnapshot) => {
      items.push({ id: childSnapshot.key, ...childSnapshot.val() });
    });
    items.reverse(); // 最新順にする

    items.forEach(thread => {
      const div = document.createElement("div");
      div.className = "thread-item";

      const showDelete = isGlobalAdmin || (thread.ownerId === currentUid);
      const deleteHtml = showDelete ? `<button class="delete-btn" onclick="deleteThread('${thread.id}')">削除</button>` : "";

      div.innerHTML = `
        <a href="thread.html?id=${thread.id}" class="thread-title">${escapeHtml(thread.title)}</a>
        <div class="meta">
          立てた人: ${thread.ownerIcon} ${escapeHtml(thread.ownerName)} | 
          更新: ${new Date(thread.lastTime).toLocaleString()}
        </div>
        ${deleteHtml}
      `;
      threadsList.appendChild(div);
    });
  });

  // 🧹 スレッド削除（一括マルチパッチ）
  window.deleteThread = async (tId) => {
    if (!confirm("このスレッドと中身のコメントをすべて削除するぺこ？")) return;
    try {
      const updates = {};
      updates[`threads/${tId}`] = null;
      updates[`posts/${tId}`] = null; 
      await update(ref(db), updates);
      alert("スレッドを削除しました 🧹");
    } catch (e) {
      alert("削除権限がないか、エラーが発生しました。");
    }
  };

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
</script>
</body>
</html>
