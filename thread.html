<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スレッド詳細</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .back-link { display: inline-block; margin-bottom: 15px; color: #ff6b81; text-decoration: none; font-weight: bold; }
    .thread-header { background: #fff0f2; padding: 20px; border-radius: 6px; margin-bottom: 20px; }
    .comment-item { padding: 15px; border-bottom: 1px solid #eee; position: relative; }
    .comment-meta { font-size: 0.85em; color: #777; margin-bottom: 5px; }
    .comment-text { white-space: pre-wrap; color: #333; }
    .form-group { margin-top: 20px; padding-top: 20px; border-top: 2px solid #ff6b81; }
    textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #ff6b81; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .delete-comment-btn { position: absolute; right: 10px; top: 15px; background: #ff4757; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← スレッド一覧に戻る</a>

  <div class="thread-header">
    <h2 id="threadTitle">読み込み中...</h2>
    <p id="threadBody" style="white-space: pre-wrap; color:#555;"></p>
    <div id="commentCountDisplay" style="font-size:0.9em; font-weight:bold; color:#ff6b81; margin-top:10px;">0件のコメント</div>
  </div>

  <h3>コメント一覧</h3>
  <div id="commentsList">Loading...</div>

  <!-- 📢 誰でも今すぐ書けるコメントフォーム -->
  <div class="form-group">
    <h3>コメントを投稿する</h3>
    <textarea id="commentInput" rows="4" placeholder="コメントを書くぺこ..."></textarea>
    <br>
    <button id="postBtn">コメントを送信</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

  // 🛠️ 【超重要】ここをご自身の Firebase 情報に「最後の一回」書き換えてください！
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const urlParams = new URLSearchParams(window.location.search);
  const threadId = urlParams.get('id');

  let currentUid = null;
  let isGlobalAdmin = false;
  let threadOwnerId = null;

  // 管理人チェック
  signInAnonymously(auth).catch(e => console.log("ゲスト閲覧"));
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUid = user.uid;
      onValue(ref(db, `admins/${currentUid}`), snap => { isGlobalAdmin = !!snap.val(); });
    }
  });

  // 親スレ読み込み
  onValue(ref(db, `threads/${threadId}`), snap => {
    const thread = snap.val();
    if (!thread) { document.getElementById("threadTitle").textContent = "❌ スレッドがありません"; return; }
    threadOwnerId = thread.ownerId;
    document.getElementById("threadTitle").textContent = thread.title;
    document.getElementById("threadBody").textContent = thread.body;
  });

  // コメント一覧
  onValue(ref(db, `posts/${threadId}`), snap => {
    const list = document.getElementById("commentsList");
    list.innerHTML = "";
    const data = snap.val();
    if (!data) { list.innerHTML = "<p>まだコメントがありません。</p>"; return; }

    let number = 1;
    for (const key in data) {
      const comment = data[key];
      const div = document.createElement("div");
      div.className = "comment-item";

      // 管理人、またはコメ主、またはスレ主なら削除できる
      const showDelete = isGlobalAdmin || (currentUid && currentUid === comment.userId) || (currentUid && currentUid === threadOwnerId);
      const deleteHtml = showDelete ? `<button class="delete-comment-btn" onclick="deleteComment('${key}')">削除</button>` : "";

      div.innerHTML = `
        <div class="comment-meta">${number}: <b>名無しさん</b> | ${new Date(comment.time).toLocaleString()}</div>
        <div class="comment-text">${escapeHtml(comment.text)}</div>
        ${deleteHtml}
      `;
      list.appendChild(div);
      number++;
    }
  });

  // コメント件数の同期
  onValue(ref(db, `thread-comment-counts/${threadId}`), snap => {
    document.getElementById("commentCountDisplay").textContent = `${snap.val() || 0}件のコメント`;
  });

  // コメント投稿
  document.getElementById("postBtn").onclick = async () => {
    const text = document.getElementById("commentInput").value.trim();
    if (!text) return;

    try {
      const nowTime = Date.now();
      await push(ref(db, `posts/${threadId}`), {
        text: text,
        time: nowTime,
        userId: currentUid || "guest"
      });

      const snap = await get(ref(db, `posts/${threadId}`));
      const currentCount = snap.val() ? Object.keys(snap.val()).length : 0;

      const updates = {};
      updates[`threads/${threadId}/lastTime`] = nowTime;
      updates[`thread-comment-counts/${threadId}`] = currentCount;
      await update(ref(db), updates);

      document.getElementById("commentInput").value = "";
    } catch (e) { alert("投稿エラーが発生しました。"); }
  };

  // コメント削除
  window.deleteComment = async (cId) => {
    if (!confirm("削除するぺこ？")) return;
    try {
      await remove(ref(db, `posts/${threadId}/${cId}`));
      const snap = await get(ref(db, `posts/${threadId}`));
      const currentCount = snap.val() ? Object.keys(snap.val()).length : 0;
      await update(ref(db), { [`thread-comment-counts/${threadId}`]: currentCount });
    } catch (e) { alert("削除権限がありません。"); }
  };

  function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; }
</script>
</body>
</html>
