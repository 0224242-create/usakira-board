<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>スレッド</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{ margin:0; font-family:sans-serif; background:linear-gradient(#ffffff,#e8dcff); }
#threadHeaderArea { background: white; padding: 16px; border-bottom: 2px solid #dcd6ff; margin-bottom: 10px; }
#threadHeaderArea h1 { margin: 0 0 8px 0; font-size: 1.6rem; color: #4a3cff; }
#threadHeaderArea .thread-body { font-size: 14px; color: #444; white-space: pre-wrap; background: #f9f7ff; padding: 10px; border-radius: 8px; }
#comments{ padding:16px; padding-bottom:110px; }
.comment{ background:white; border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 3px 6px rgba(0,0,0,0.12); }
.header{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.icon{ width:36px; height:36px; border-radius:50%; object-fit:cover; }
.name{ font-weight:bold; font-size:15px; }
.time{ font-size:12px; color:#777; margin-left:4px; }
.actions{ margin-left:auto; display:flex; gap:5px; }
.actions button{ font-size:12px; padding:3px 6px; }
.text{ font-size:15px; line-height:1.4; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; }
.comment img{ max-width:220px; border-radius:8px; margin-top:6px; cursor:pointer; }
.edit{ font-size:12px; color:gray; margin-top:3px; }
#commentBox{ position:fixed; bottom:0; left:0; width:100%; background:white; padding:6px; box-shadow:0 -2px 5px rgba(0,0,0,0.1); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
#commentInput{ flex:1; padding:7px; font-size:14px; min-width:150px; }
#imageInput{ font-size:12px; }
#fileName{ font-size:12px; color:#555; }
#postBtn{ padding:7px 10px; font-size:13px; }
#postStatus{ font-size:12px; color:green; }
a{ color:#5a4cff; word-break:break-all; }
#imageModal{ position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; }
#imageModal img{ max-width:90%; max-height:90%; }
</style>
</head>
<body>

<div id="threadHeaderArea">
<h1 id="mainThreadTitle">読み込み中…</h1>
<div id="mainThreadBody" class="thread-body" style="display:none;"></div>
</div>

<div id="comments"></div>

<div id="commentBox">
<input id="commentInput" placeholder="コメントを書くぺこ（1000文字以内）">
<input type="file" id="imageInput" accept="image/*">
<span id="fileName"></span>
<button id="postBtn">投稿</button>
<span id="postStatus"></span>
</div>

<div id="imageModal" onclick="this.style.display='none'">
<img id="modalImg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
import { getDatabase, ref, onValue, push, update, get } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

// あなたのFirebaseプロジェクト用に完全に最適化したConfigです
const firebaseConfig={
  apiKey: "AIzaSyDwp6403Wctjo-2vjR373CjfJXDDGUp7do",
  authDomain: "keijiban-7c651.firebaseapp.com",
  projectId: "keijiban-7c651",
  storageBucket: "keijiban-7c651.appspot.com",
  messagingSenderId: "587652395561",
  appId: "1:587652395561:web:ddf858fdf84df2438491c3",
  databaseURL: "https://keijiban-7c651-default-rtdb.firebaseio.com"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const params=new URLSearchParams(location.search);
const threadId=params.get("id");

const commentsRef=ref(db,"posts/"+threadId);

const defaultName="名もなき兎";
const defaultIcon="usagi.png.jpeg";

const userName=localStorage.getItem("usakira_name")||defaultName;
const userIcon=localStorage.getItem("usakira_icon")||defaultIcon;

let currentUid = null;

signInAnonymously(auth).catch(error => { console.error(error); });

function linkify(text){
  const urlRegex=/https?:\/\/[^\s]+/g;
  return text.replace(urlRegex,url=>{ return `<a href="${url}" target="_blank">${url}</a>`; });
}

function escapeHtml(str){
  if(!str)return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

window.openImage = (src) => {
  document.getElementById("modalImg").src=src;
  document.getElementById("imageModal").style.display="flex";
};

onAuthStateChanged(auth, async user => {
  if (!user) return;
  currentUid = user.uid;

  /* スレッド情報のロード */
  onValue(ref(db, "threads/" + threadId), async snap => {
    const t = snap.val();
    if(t) {
      if(t.hasPass) {
        const savedPw = sessionStorage.getItem("room_auth_" + threadId);
        try {
          const authSnap = await get(ref(db, `posts/${threadId}/_authCheck/key`));
          if ((!authSnap.exists() || authSnap.val() !== savedPw) && t.ownerId !== currentUid) {
            alert("このスレッドを表示するには正しいパスワードが必要です。");
            location.href = "index.html";
            return;
          }
        } catch(e) {
          if (t.ownerId !== currentUid) {
            alert("アクセス権限がありません。");
            location.href = "index.html";
            return;
          }
        }
      }

      document.getElementById("mainThreadTitle").textContent = (t.hasPass ? "🔒 " : "") + t.title;
      if(t.body && t.body.trim() !== "") {
        document.getElementById("mainThreadBody").textContent = t.body;
        document.getElementById("mainThreadBody").style.display = "block";
      } else {
        document.getElementById("mainThreadBody").style.display = "none";
      }
    } else {
      document.getElementById("mainThreadTitle").textContent = "スレッドが存在しないか削除されました。";
    }
  });

  loadComments();
});

function loadComments(){
  onValue(commentsRef,snap=>{
    const data=snap.val();
    let html="";
    if(data){
      const list=Object.entries(data).sort((a,b)=>b[1].time-a[1].time);

      list.forEach(([key,c]) => {
        if(key === "_authCheck") return;
        
        const text = linkify(escapeHtml(c.text || ""));
        let actionButtons = "";
        
        if(c.userId === currentUid) {
          actionButtons = `
            <div class="actions">
              <span style="font-size:11px;color:gray;">（ルールにより編集・削除禁止）</span>
            </div>
          `;
        }

        html+=`<div class="comment">
          <div class="header">
            <img class="icon" src="${c.icon||defaultIcon}" onerror="this.src='${defaultIcon}'">
            <div class="name">
              ${escapeHtml(c.name)||defaultName}
              <span class="time">${c.time?new Date(c.time).toLocaleString():""}</span>
            </div>
            ${actionButtons}
          </div>
          <div class="text">${text}</div>
          ${c.image?`<img src="${c.image}" onclick="openImage('${c.image}')">`:""}
        </div>`;
      });
    }
    document.getElementById("comments").innerHTML=html;
  });
}

function compressImage(file){
  return new Promise(resolve=>{
    const img=new Image(); const canvas=document.createElement("canvas"); const ctx=canvas.getContext("2d");
    img.onload=()=>{
      let w=img.width; let h=img.height; const max=1000;
      if(w>h){ if(w>max){ h*=max/w; w=max; } }else{ if(h>max){ w*=max/h; h=max; } }
      canvas.width=w; canvas.height=h; ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{ resolve(blob); },"image/jpeg",0.7);
    };
    img.src=URL.createObjectURL(file);
  });
}

async function uploadImage(file){
  const compressed=await compressImage(file);
  const formData=new FormData();
  formData.append("file",compressed);
  formData.append("upload_preset","usakira_upload");
  const res=await fetch("https://api.cloudinary.com/v1_1/dfhevulda/image/upload",{method:"POST",body:formData});
  const data=await res.json();
  return data.secure_url;
}

document.getElementById("postBtn").onclick=async()=>{
  if(!currentUid) return alert("ログイン処理中です");
  const text=document.getElementById("commentInput").value.trim();
  const file=document.getElementById("imageInput").files[0];
  
  if(!text && !file){ alert("コメントか画像を入れてください"); return; }
  if(text.length > 1000){ alert("コメントは1000文字以内にしてね"); return; }

  let imageURL="";
  if(file){ imageURL=await uploadImage(file); }

  await push(commentsRef,{
    text:text,
    image:imageURL,
    time:Date.now(),
    name:userName.substring(0, 50),
    icon:userIcon,
    userId:currentUid
  });

  update(ref(db, "threads/" + threadId), { lastTime: Date.now() });

  document.getElementById("commentInput").value="";
  document.getElementById("imageInput").value="";
  document.getElementById("fileName").textContent="";
  document.getElementById("postStatus").textContent="投稿しました！";
  setTimeout(()=>{ document.getElementById("postStatus").textContent=""; },2000);
};

document.getElementById("imageInput").onchange=e=>{
  const file=e.target.files[0];
  document.getElementById("fileName").textContent=file?file.name:"";
};
</script>
</body>
</html>
