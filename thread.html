<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スレッド詳細</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .back-link { display: inline-block; margin-bottom: 15px; color: #ff6b81; text-decoration: none; font-weight: bold; }
    .thread-header { background: #fff0f2; padding: 20px; border-radius: 6px; margin-bottom: 20px; }
    .comment-item { padding: 15px; border-bottom: 1px solid #eee; position: relative; }
    .comment-meta { font-size: 0.85em; color: #777; margin-bottom: 5px; }
    .comment-text { white-space: pre-wrap; color: #333; }
    .comment-img { max-width: 200px; display: block; margin-top: 10px; border-radius: 4px; }
    .form-group { margin-top: 20px; padding-top: 20px; border-top: 2px solid #ff6b81; }
    textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #ff6b81; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .delete-comment-btn { position: absolute; right: 10px; top: 15px; background: #ff4757; color: white; border: none; padding: 3px 8px; font-size: 0.8em; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← スレッド一覧に戻る</a>

  <div class="thread-header">
    <h2 id="threadTitle">スレッドを読み込み中...</h2>
    <p id="threadBody" style="white-space: pre-wrap; color:#555;"></p>
    <div id="commentCountDisplay" style="font-size:0.9em; font-weight:bold; color:#ff6b81; margin-top:10px;">0件のコメント</div>
  </div>

  <h3>コメント一覧</h3>
  <div id="commentsList">Loading...</div>

  <div class="form-group">
    <h3>コメントを投稿する</h3>
    <textarea id="commentInput" rows="4" placeholder="ログイン処理中ぺこ..." disabled></textarea>
    <br>
    <button id="postBtn" disabled>コメントを送信</button>
    <span id="postStatus" style="font-size: 0.85em; color: #777; margin-left: 10px;"></span>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

  // 🛠️ あなたの Firebase 設定に書き換えてください
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const urlParams = new URLSearchParams(window.location.search);
  const threadId = urlParams.get('id');

  if (!threadId) {
    alert("スレッドIDがありません。トップに戻ります。");
    window.location.href = "index.html";
  }

  let currentUid = null;
  let authReady = false;
  let isGlobalAdmin = false;
  let threadOwnerId = null;

  // 🚀 爆速・キャッシュ優先の認証監視（詳細画面側）
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUid = user.uid;
      authReady = true;

      // 開いた瞬間一秒も待たせず即アンロック！
      const input = document.getElementById("commentInput");
      const btn = document.getElementById("postBtn");
      input.disabled = false;
      input.placeholder = "コメントを書くぺこ（1000文字以内）";
      btn.disabled = false;

      // 管理者チェック
      onValue(ref(db, `admins/${currentUid}`), snap => {
        isGlobalAdmin = !!snap.val();
      });
    } else {
      authReady = false;
      signInAnonymously(auth).catch(e => console.error(e));
    }
  });

  // 📂 親スレッド情報の読み込み
  onValue(ref(db, `threads/${threadId}`), snap => {
    const thread = snap.val();
    if (!thread) {
      document.getElementById("threadTitle").textContent = "❌ スレッドが存在しないか削除されました";
      return;
    }
    threadOwnerId = thread.ownerId;
    document.getElementById("threadTitle").textContent = thread.title;
    document.getElementById("threadBody").textContent = thread.body;
  });

  // 📂 コメント一覧の取得 ＆ 表示時に安全カウント
  onValue(ref(db, `posts/${threadId}`), snap => {
    const list = document.getElementById("commentsList");
    const countDisplay = document.getElementById("commentCountDisplay");
    list.innerHTML = "";
    const data = snap.val();

    if (!data) {
      list.innerHTML = "<p>まだコメントがありません。最初の投稿をどうぞ！</p>";
      countDisplay.textContent = "0件のコメント";
      return;
    }

    // クライアント側で安全に件数を算出（ズレ・チートの余地なし）
    const commentCount = Object.keys(data).length;
    countDisplay.textContent = `${commentCount}件のコメント`;

    let number = 1;
    for (const key in data) {
      const comment = data[key];
      const div = document.createElement("div");
      div.className = "comment-item";

      const showDelete = isGlobalAdmin || (currentUid === comment.userId) || (currentUid === threadOwnerId);
      const deleteHtml = showDelete ? `<button class="delete-comment-btn" onclick="deleteComment('${key}')">削除</button>` : "";
      const imgHtml = comment.image ? `<img src="${escapeHtml(comment.image)}" class="comment-img">` : "";

      div.innerHTML = `
        <div class="comment-meta">
          ${number}: <b>${escapeHtml(comment.name)}</b> ${comment.icon} | ${new Date(comment.time).toLocaleString()}
        </div>
        <div class="comment-text">${escapeHtml(comment.text)}</div>
        ${imgHtml}
        ${deleteHtml}
      `;
      list.appendChild(div);
      number++;
    }
  });

  // 📝 コメント投稿処理
  document.getElementById("postBtn").onclick = async () => {
    if (!authReady || !currentUid) { alert("準備中ぺこ！"); return; }
    const btn = document.getElementById("postBtn");
    const text = document.getElementById("commentInput").value.trim();
    if (!text) { alert("コメントを入力してください"); return; }
    if (text.length > 1000) { alert("コメントは1000文字以内にしてね"); return; }

    btn.disabled = true;
    document.getElementById("postStatus").textContent = "投稿中...";

    try {
      const nowTime = Date.now();

      // 1. コメントを posts に追加
      await push(ref(db, `posts/${threadId}`), {
        text: text,
        image: "", 
        time: nowTime,
        name: "名無しさん",
        icon: "🐰",
        userId: currentUid
      });

      // 2. スレ上げ（lastTimeフィールドだけを部分更新：ルールで一般人にも認可済）
      await update(ref(db, `threads/${threadId}`), {
        lastTime: nowTime
      });

      document.getElementById("commentInput").value = "";
      document.getElementById("postStatus").textContent = "投稿完了！";
      setTimeout(() => { document.getElementById("postStatus").textContent = ""; }, 2000);
    } catch (e) {
      console.error(e);
      alert("投稿に失敗しました。");
    } finally {
      btn.disabled = false;
    }
  };

  // 🧹 コメント削除処理
  window.deleteComment = async (cId) => {
    if (!confirm("このコメントを削除するぺこ？")) return;
    try {
      await remove(ref(db, `posts/${threadId}/${cId}`));
      alert("コメントを削除しました。");
    } catch (e) {
      alert("削除権限がありません。");
    }
  };

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
</script>
</body>
</html>
